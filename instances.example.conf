# 复现实例清单。复制成 instances.conf 按自己的环境改。
# 每行一个实例，空白分隔，缺省值写 -：
#
#   label      版本名，也是判读结果里的版本键（judged/*.json 的 per_version）
#   port       端口
#   osuser     实例所属 OS 用户（脚本以 root 跑时 su 过去；本身就是该用户则直接跑）。
#              该用户的 ~/.og_env 要能让 gsql 在 PATH 里，可用 OG_ENV 环境变量改路径
#   unit       systemd 单元名；没有写 -
#   revive     yes  = 实例挂了允许 systemctl start 拉起（专用复现实例）
#              wait = 只等它自己恢复，绝不主动重启（现役/共享实例）
#   caps       插件能力，逗号分隔：dolphin（B 兼容，bench_b）/ shark（D 兼容，bench_d）；没有写 -
#              没有对应能力的实例上，这类用例判「缺依赖」而不是「不复现」
#   build      构建号，写进 case.env 的 REPRO_BUILD；不知道写 -
#   core_glob  core 文件通配，跑批时只留最新一个（一个几百 MB）；不需要写 -
#
# 行的顺序 = 主复现落点的优先级（多个版本都复现时，排前面的当 REPRO_PORT）。
# 能力通常不对等，没有哪台能覆盖全部——多挂几个版本，缺陷的版本边界才看得出来。

# label      port  osuser     unit                      revive  caps     build     core_glob
7.0.0-RC1    5432  opengauss  -                         wait    shark    12c995f   -
5.0.0        6432  og500      opengauss-5.0.0.service   yes     dolphin  a07d57c3  /data/opengauss-5.0.0/core-*
6.0.0        7432  og600      opengauss-6.0.0.service   yes     dolphin  aee4abd5  /data/opengauss-6.0.0/core-*
